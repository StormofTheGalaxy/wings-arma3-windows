name: Push

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.11", "1.25.5"]
        goarch: [amd64]
    permissions:
      contents: read
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ matrix.go }}

      - name: go mod download
        env:
          CGO_ENABLED: 0
        run: go mod download

      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          SRC_PATH: github.com/pterodactyl/wings
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -v -trimpath -ldflags="-s -w -X $env:SRC_PATH/system.Version=dev-$shortSha" -o dist/wings.exe $env:SRC_PATH
          go build -v -trimpath -ldflags="-X $env:SRC_PATH/system.Version=dev-$shortSha" -o dist/wings_debug.exe $env:SRC_PATH

      - name: go test
        env:
          CGO_ENABLED: 0
        run: go test ./...

      - name: go test -race
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Upload Release Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ (github.ref == 'refs/heads/develop' || github.event_name == 'pull_request') && matrix.go == '1.24.11' }}
        with:
          name: wings_windows_${{ matrix.goarch }}
          path: dist/wings.exe

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ (github.ref == 'refs/heads/develop' || github.event_name == 'pull_request') && matrix.go == '1.24.11' }}
        with:
          name: wings_windows_${{ matrix.goarch }}_debug
          path: dist/wings_debug.exe
